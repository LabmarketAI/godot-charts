name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  addon-sync-check:
    name: Addon Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: src

      - name: Verify addons are synchronized
        run: |
          cd src
          bash scripts/check-demo-addon-sync.sh

  unit-tests:
    name: Unit Tests (.NET)
    runs-on: ubuntu-latest
    needs: addon-sync-check

    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore test project
        run: dotnet restore tests/GodotChartsTests.csproj

      - name: Run NUnit tests
        run: dotnet test tests/GodotChartsTests.csproj --configuration Release --verbosity minimal

  m1-standard-godot:
    name: M1 Pure GDScript (Godot 4.6.3)
    runs-on: ubuntu-latest
    needs: addon-sync-check

    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      - name: Setup Python fixture environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/m1/requirements.txt

      - name: Install fixture-only Python dependencies
        run: python -m pip install -r tools/m1/requirements.txt

      - name: Regenerate and validate M1 fixtures
        run: |
          python tools/m1/generate_fixture.py
          python tools/m1/validate_fixtures.py
          git diff --exit-code -- tests/m1/fixtures

      - name: Install official standard Godot
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          GODOT_SHA256: d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3
        run: |
          curl --fail --location "$GODOT_URL" --output /tmp/godot.zip
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Audit preview package and run headless tests
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
        run: bash scripts/test-m1-contract.sh
